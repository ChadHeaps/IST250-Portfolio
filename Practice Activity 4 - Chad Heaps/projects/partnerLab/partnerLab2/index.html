<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../projectheader.css">
    <script src="script.js" defer></script>
    <title>We're Glad To Have You Friend</title>
</head>
<body>
    <div class="projectheader">
        <p>Chad Heaps - IST 250 Portfolio | <a href="../../../index.html">Click Here To Return To Portfolio Homepage</a></p>
    </div>

    <header id="header">
        <h1 id="hOne">Welcome User!</h1>
        <p id="pGraph">Please Fill Out Some Information So We Can Get To Know You!</p>
    </header>
    
    <main id="mainBody">
        <h2>Customize Your Page</h2>
        <form id="formData">

            <label for="newName">Please Enter Your Name!</label>
            <input type="text" name="newName" id="newName">

            <label for="customMessage">Enter A New Message For When You Arrive</label>
            <input type="text" name="customMessage" id="customMessage">

            <label for="backGround">Here You Can Select A New Background For When You Join!</label>
            <select name="backGround" id="backGround">
                <option value="red">Red</option>
                <option value="blue">Blue</option>
                <option value="green">Green</option>
                <option value="orange">Orange</option>
            </select>
            <br>
            <input type="submit" onclick="pullInfo(event)" value="Customize" id="submitInfo">
        </form>
    </main>
</body>
</html>
